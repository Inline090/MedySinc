[project]
name = "medsync-api"
version = "0.1.0"
description = "MedSync backend API"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
