<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" role="img" aria-label="MedSync deployed architecture">
  <title>MedSync architecture</title>

  <rect width="1120" height="860" fill="#FAF7F2"/>

  <defs>
    <marker id="arrowPath" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B0763A"/>
    </marker>
    <marker id="arrowStore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A847C"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="40" y="52" font-size="19" font-weight="600" fill="#2A2724">MedSync: how it runs in production</text>
    <text x="40" y="76" font-size="12.5" fill="#6E6862">One host, two ports. The browser calls Next.js, Next.js calls the API, and the API is the only thing that touches the database or the model.</text>

    <!-- browser -->
    <rect x="380" y="110" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#D9D2C7"/>
    <text x="560" y="132" font-size="13" font-weight="600" fill="#2A2724" text-anchor="middle">Browser</text>
    <text x="560" y="149" font-size="11" fill="#6E6862" text-anchor="middle">React 19 client components</text>

    <!-- web tier -->
    <rect x="40" y="190" width="1040" height="84" rx="10" fill="#F4F0E9" stroke="#D9D2C7" stroke-dasharray="5 4"/>
    <text x="60" y="212" font-size="10" font-weight="600" fill="#928B82" letter-spacing="1.2">WEB TIER: NEXT.JS ON PORT 80</text>
    <rect x="60" y="222" width="1000" height="36" rx="6" fill="#FFFFFF" stroke="#D9D2C7"/>
    <text x="76" y="245" font-size="11.5" fill="#2A2724">App Router: server components render the shell, client islands handle uploads and the ask thread</text>

    <!-- api tier -->
    <rect x="40" y="300" width="1040" height="110" rx="10" fill="#F4F0E9" stroke="#D9D2C7" stroke-dasharray="5 4"/>
    <text x="60" y="322" font-size="10" font-weight="600" fill="#928B82" letter-spacing="1.2">API: FASTAPI ON PORT 8000</text>
    <rect x="60" y="332" width="1000" height="34" rx="6" fill="#FFFFFF" stroke="#D9D2C7"/>
    <text x="76" y="354" font-size="11.5" fill="#2A2724">Auth middleware: JWT access token, refresh token in an httpOnly cookie, token version checked on every request</text>
    <rect x="60" y="372" width="1000" height="30" rx="6" fill="#FFFFFF" stroke="#D9D2C7"/>
    <text x="76" y="392" font-size="11.5" fill="#2A2724">Sliding window rate limiter on register, login, upload and ask. Routers: auth, documents, qa, medicines, healthcheck</text>

    <!-- ingestion -->
    <rect x="40" y="438" width="300" height="172" rx="8" fill="#FFFFFF" stroke="#B0763A" stroke-width="1.5"/>
    <text x="58" y="462" font-size="13" font-weight="600" fill="#2A2724">Ingestion</text>
    <text x="58" y="484" font-size="11" fill="#6E6862">Runs as a background task</text>
    <text x="58" y="500" font-size="11" fill="#6E6862">after the upload response.</text>
    <text x="58" y="530" font-size="11" fill="#2A2724">PDF text, or OCR when</text>
    <text x="58" y="546" font-size="11" fill="#2A2724">there is no text layer</text>
    <text x="58" y="576" font-size="11" fill="#2A2724">Sentence aware chunks,</text>
    <text x="58" y="592" font-size="11" fill="#2A2724">512 tokens, 64 overlap</text>

    <!-- storage -->
    <rect x="360" y="438" width="180" height="172" rx="8" fill="#FFFFFF" stroke="#8A847C" stroke-dasharray="5 4"/>
    <text x="450" y="462" font-size="12" font-weight="600" fill="#2A2724" text-anchor="middle">Object storage</text>
    <text x="450" y="484" font-size="11" fill="#6E6862" text-anchor="middle">S3, or local disk</text>
    <text x="450" y="500" font-size="11" fill="#6E6862" text-anchor="middle">in development</text>
    <text x="450" y="530" font-size="11" fill="#928B82" text-anchor="middle">The original file,</text>
    <text x="450" y="546" font-size="11" fill="#928B82" text-anchor="middle">under a per user prefix</text>
    <text x="450" y="576" font-size="11" fill="#928B82" text-anchor="middle">Deduplicated by</text>
    <text x="450" y="592" font-size="11" fill="#928B82" text-anchor="middle">content hash</text>

    <!-- ask -->
    <rect x="580" y="438" width="300" height="172" rx="8" fill="#FFFFFF" stroke="#B0763A" stroke-width="1.5"/>
    <text x="598" y="462" font-size="13" font-weight="600" fill="#2A2724">Question answering</text>
    <text x="598" y="484" font-size="11" fill="#6E6862">Answered only from chunks</text>
    <text x="598" y="500" font-size="11" fill="#6E6862">that belong to the caller.</text>
    <text x="598" y="526" font-size="11" fill="#2A2724">Embed the question, then</text>
    <text x="598" y="542" font-size="11" fill="#2A2724">hybrid search: vector plus</text>
    <text x="598" y="558" font-size="11" fill="#2A2724">full text, fused with RRF</text>
    <text x="598" y="584" font-size="11" fill="#2A2724">Cross encoder rerank, then</text>
    <text x="598" y="600" font-size="11" fill="#2A2724">the model writes the answer</text>

    <!-- model api -->
    <rect x="900" y="438" width="180" height="172" rx="8" fill="#FFFFFF" stroke="#8A847C" stroke-dasharray="5 4"/>
    <text x="990" y="462" font-size="12" font-weight="600" fill="#2A2724" text-anchor="middle">Model API</text>
    <text x="990" y="484" font-size="11" fill="#6E6862" text-anchor="middle">Answers, summaries</text>
    <text x="990" y="500" font-size="11" fill="#6E6862" text-anchor="middle">and medicines</text>
    <text x="990" y="530" font-size="11" fill="#928B82" text-anchor="middle">Receives excerpts only,</text>
    <text x="990" y="546" font-size="11" fill="#928B82" text-anchor="middle">after phone numbers and</text>
    <text x="990" y="562" font-size="11" fill="#928B82" text-anchor="middle">emails are stripped</text>
    <text x="990" y="592" font-size="11" fill="#928B82" text-anchor="middle">30 second timeout</text>

    <!-- database -->
    <rect x="40" y="626" width="1040" height="112" rx="10" fill="#F4F0E9" stroke="#D9D2C7" stroke-dasharray="5 4"/>
    <text x="60" y="648" font-size="10" font-weight="600" fill="#928B82" letter-spacing="1.2">DATABASE: POSTGRESQL WITH PGVECTOR</text>
    <rect x="60" y="658" width="1000" height="68" rx="6" fill="#FFFFFF" stroke="#D9D2C7"/>
    <text x="76" y="682" font-size="11.5" fill="#2A2724">users, identities, documents, document_medicines, answer_cache, rate_limit_events, schema_migrations</text>
    <text x="76" y="702" font-size="11.5" fill="#2A2724">document_chunks holds the text and a 1024 dimension vector, with an HNSW index using cosine distance.</text>
    <text x="76" y="718" font-size="10.5" fill="#928B82">Schema changes are numbered SQL files, applied by a small runner that records what it has run.</text>

    <!-- y is 438 to 610, so these arrows start at 610 -->
    <line x1="560" y1="162" x2="560" y2="188" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="572" y="180" font-size="10.5" fill="#B0763A">HTTPS</text>

    <line x1="560" y1="274" x2="560" y2="298" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="572" y="292" font-size="10.5" fill="#B0763A">fetch /api/* with cookies</text>

    <line x1="190" y1="410" x2="190" y2="436" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="200" y="428" font-size="10.5" fill="#B0763A">upload returns, work continues</text>

    <line x1="730" y1="410" x2="730" y2="436" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="740" y="428" font-size="10.5" fill="#B0763A">ask</text>

    <line x1="340" y1="513" x2="358" y2="513" stroke="#8A847C" stroke-width="1.6" marker-end="url(#arrowStore)"/>
    <line x1="880" y1="513" x2="898" y2="513" stroke="#8A847C" stroke-width="1.6" marker-end="url(#arrowStore)"/>

    <line x1="190" y1="610" x2="190" y2="624" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="200" y="620" font-size="10.5" fill="#6E6862">text and vectors</text>

    <line x1="730" y1="610" x2="730" y2="624" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="740" y="620" font-size="10.5" fill="#6E6862">a search over your own chunks</text>

    <!-- legend -->
    <line x1="40" y1="770" x2="76" y2="770" stroke="#B0763A" stroke-width="1.6" marker-end="url(#arrowPath)"/>
    <text x="86" y="774" font-size="11" fill="#6E6862">request path</text>
    <line x1="200" y1="770" x2="236" y2="770" stroke="#8A847C" stroke-width="1.6" marker-end="url(#arrowStore)"/>
    <text x="246" y="774" font-size="11" fill="#6E6862">stored or external</text>

    <text x="40" y="812" font-size="10.5" fill="#928B82">Not shown: there is no queue and no separate worker. Ingestion runs inside the API process, so a restart mid job leaves that</text>
    <text x="40" y="828" font-size="10.5" fill="#928B82">document unfinished. A question is cached after its first answer, so repeating it skips the search and the model call.</text>

  </g>
</svg>
